name: Source compatibility
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 5 * * 0'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      rehearsal:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.policy.outputs.plan }}
      code: ${{ steps.policy.outputs.code }}
      source: ${{ steps.policy.outputs.source }}
      units: ${{ steps.policy.outputs.units }}
      verification: ${{ steps.policy.outputs.verification }}
      archive: ${{ steps.policy.outputs.archive }}
      mode: ${{ steps.policy.outputs.mode }}
      reference_full: ${{ steps.policy.outputs.reference_full }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed inputs and show required proofs
        id: policy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name }}
          FORCE_FULL: ${{ inputs.full || false }}
          REHEARSAL: ${{ inputs.rehearsal || false }}
        run: |
          arguments=()
          [ "$EVENT" != push ] || arguments+=(--direct)
          tools/test.sh --classify "${BASE:-unavailable}" --ci "${arguments[@]}" > "$RUNNER_TEMP/classification.json"
          options=()
          [ "$FORCE_FULL" != true ] || options+=(--full)
          [ "$REHEARSAL" != true ] || options+=(--rehearsal)
          plan=$(python3 tools/ci-policy.py plan --classification "$(cat "$RUNNER_TEMP/classification.json")" --event "$EVENT" "${options[@]}")
          printf '%s\n' "$plan" | tee "$RUNNER_TEMP/plan.json"
          printf 'plan=%s\n' "$plan" >> "$GITHUB_OUTPUT"
          for key in code source units verification archive mode reference_full; do
            printf '%s=%s\n' "$key" "$(jq -r ".$key" <<< "$plan")" >> "$GITHUB_OUTPUT"
          done
      - name: Lightweight policy and transport regression checks
        run: |
          python3 test/ci-policy-tests.py
          python3 test/ci-bundle-tests.py
          python3 test/ci-version-probes-tests.py
          bash test/ci-provision-logging-tests.sh
          bash test/ci-archive-isolation-tests.sh
          bash test/llvm-discovery-tests.sh
          python3 test/test-runner-tests.py
          python3 test/test-classify-tests.py
          python3 test/validation-coverage-tests.py
          python3 test/source-verification-tests.py
          python3 test/runner-source-tests.py
          bash test/r7rs-range-assembly-tests.sh
          python3 test/compiler-telemetry-tests.py
          python3 test/baseline-harness-tests.py
          python3 test/verification-setup-tests.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-plan
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/classification.json
          if-no-files-found: error

  prepare:
    needs: policy
    if: needs.policy.outputs.code == 'true'
    uses: ./.github/workflows/prepare-toolchains.yml
  native:
    needs: [policy, prepare]
    if: needs.policy.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        llvm: [22, 23]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ matrix.llvm }}
          path: ${{ runner.temp }}/bundle
      - name: Restore and re-probe candidate toolchain
        run: |
          python3 tools/ci-bundle.py restore "${{ matrix.llvm }}" "$RUNNER_TEMP/emit-deps" "$RUNNER_TEMP/bundle"
          tools/ci-provision.sh "${{ matrix.llvm }}" "$RUNNER_TEMP/emit-deps" >> "$GITHUB_ENV"
      - name: Prepare native test prerequisites
        run: |
          if ! command -v timeout >/dev/null 2>&1 && [ "$RUNNER_OS" = macOS ]; then
            command -v gtimeout >/dev/null 2>&1 || brew install coreutils >&2
            mkdir -p "$RUNNER_TEMP/emit-test-tools"
            ln -s "$(command -v gtimeout)" "$RUNNER_TEMP/emit-test-tools/timeout"
            printf '%s\n' "$RUNNER_TEMP/emit-test-tools" >> "$GITHUB_PATH"
          fi

      - name: Build and test committed bootstrap IR
        env:
          LLVM_MAJOR: ${{ matrix.llvm }}
          MODE: ${{ needs.policy.outputs.mode }}
        run: |
          set -o pipefail
          profile=full
          if [ "$LLVM_MAJOR" = 22 ] && [ "$MODE" != full ]; then profile=compat; fi
          tools/ci-check.sh "$LLVM_MAJOR" "$profile" 2>&1 | tee "$RUNNER_TEMP/compatibility.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compatibility-${{ runner.os }}-${{ matrix.llvm }}
          path: |
            ${{ runner.temp }}/compatibility.log
            ${{ runner.temp }}/emit-native-*.json
            build/native-config
            build/llvm.mk
          if-no-files-found: warn

  verification:
    needs: [policy, prepare]
    if: needs.policy.outputs.verification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: toolchain-Linux-X64-23
          path: ${{ runner.temp }}/bundle
      - name: Restore and re-probe candidate toolchain
        run: |
          python3 tools/ci-bundle.py restore "23" "$RUNNER_TEMP/emit-deps" "$RUNNER_TEMP/bundle"
          tools/ci-provision.sh "23" "$RUNNER_TEMP/emit-deps" >> "$GITHUB_ENV"
      - name: Verify current source without Chez
        if: needs.policy.outputs.source == 'true'
        run: |
          tools/test.sh source --report "$RUNNER_TEMP/source.json"

      - name: Prepare independent verification host
        env:
          PLAN: ${{ needs.policy.outputs.plan }}
        run: |
          if jq -e '.units or .reference_full or (.reference | length > 0)' <<< "$PLAN" >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y chezscheme
            mkdir -p "$RUNNER_TEMP/emit-reference-tools"
            # Chez selects its boot file using argv[0]; a renamed symlink
            # searches for chez.boot instead of Debian's scheme.boot.
            printf '#!/usr/bin/env bash\nexec %q "$@"\n' "$(command -v scheme)" > "$RUNNER_TEMP/emit-reference-tools/chez"
            chmod +x "$RUNNER_TEMP/emit-reference-tools/chez"
            printf '%s\n' "$RUNNER_TEMP/emit-reference-tools" >> "$GITHUB_PATH"
          fi

      - name: Run direct current-source units
        if: needs.policy.outputs.units == 'true'
        run: |
          tools/test.sh units --report "$RUNNER_TEMP/units.json"

      - name: Run full or targeted independent-host proof
        env:
          PLAN: ${{ needs.policy.outputs.plan }}
        run: |
          if jq -e '.reference_full' <<< "$PLAN" >/dev/null; then
            tools/test.sh reference --report "$RUNNER_TEMP/reference.json"
          elif [ "$(jq '.reference | length' <<< "$PLAN")" -gt 0 ]; then
            suites=()
            while IFS= read -r suite; do suites+=(--suite "$suite"); done < <(jq -r '.reference[]' <<< "$PLAN")
            tools/test.sh reference "${suites[@]}" --report "$RUNNER_TEMP/reference.json"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compiler-verification
          path: |
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/units.json
            ${{ runner.temp }}/reference.json
          if-no-files-found: warn

  package:
    needs: policy
    if: needs.policy.outputs.archive == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact identity and immutable packaging guards
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          tag="${RELEASE_TAG:-v$(< VERSION)}"
          tools/release-source.sh HEAD "$RUNNER_TEMP/assets" "$tag"
          tools/release-source.sh HEAD "$RUNNER_TEMP/repeated" "$tag"
          diff -r "$RUNNER_TEMP/assets" "$RUNNER_TEMP/repeated"
          test/release-source-tests.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-release
          path: |
            ${{ runner.temp }}/assets/*
          if-no-files-found: error

  archive:
    needs: [policy, prepare, package]
    if: needs.policy.outputs.archive == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-release
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: toolchain-${{ runner.os }}-${{ runner.arch }}-23
          path: ${{ runner.temp }}/bundle
      - name: Restore and re-probe candidate toolchain
        run: |
          python3 tools/ci-bundle.py restore "23" "$RUNNER_TEMP/emit-deps" "$RUNNER_TEMP/bundle"
          tools/ci-provision.sh "23" "$RUNNER_TEMP/emit-deps" >> "$GITHUB_ENV"
      - name: Build exact archive with network and checkout denied
        run: |
          set -o pipefail
          tools/ci-archive.sh "$RUNNER_TEMP/assets" 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: archive-${{ runner.os }}
          path: |
            ${{ runner.temp }}/archive.log
          if-no-files-found: warn

  required:
    name: Required validation
    if: always()
    needs: [policy, prepare, native, verification, package, archive]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every selected proof
        env:
          PLAN: ${{ needs.policy.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 tools/ci-policy.py aggregate --plan "$PLAN" --needs "$NEEDS"
