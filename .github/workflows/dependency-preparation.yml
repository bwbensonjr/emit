name: Trusted dependency preparation
on:
  push:
    branches: [main]
    paths: ['tools/ci-provision.sh', 'tools/ci-bundle.py', 'tools/ci-resolve.py', 'tools/ci-prepare.sh', '.github/workflows/prepare-toolchains.yml', '.github/workflows/dependency-preparation.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: trusted-dependencies-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/prepare-toolchains.yml
